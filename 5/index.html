<!DOCTYPE html>
<html>

</head>
<body>

<div class="container">

  <h1>Students Mobility Dashboard</h1>

  <button onclick="loadStudents()">
    Refresh Students
  </button>

  <table id="studentsTable">

      <tr>
        <th>Name</th>
        <th>University</th>
        <th>Country</th>

        <th>Status</th>

    <tbody></tbody>

  </table>

</div>

<script src="app.js"></script>
</body>
</html>
